name: Administrative boundaries
on:
  push:
    paths:
      - 'js/core/AdminTerritorySystem.js'
      - 'js/core/World.js'
      - 'js/render/Renderer.js'
      - 'js/main.js'
      - 'scripts/download-admin-boundaries.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-boundaries.yml'
  pull_request:
    paths:
      - 'js/core/AdminTerritorySystem.js'
      - 'js/core/World.js'
      - 'js/render/Renderer.js'
      - 'js/main.js'
      - 'scripts/download-admin-boundaries.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-boundaries.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
